<script defer src="assets/lesson-data.js?v=20261023"></script><script defer src="assets/app.js?v=20261023"></script><script>window.RKI_MANUAL_UI={"Знакомство":"相识；结识；认识；初次见面","Послушайте и выберите услышанное слово.":"听录音，并选出听到的单词。","Сколько слогов":"有几个音节？","Послушайте слово. Выберите количество слогов.":"听单词。选出音节数量。","Ударение":"重音","Послушайте. Выберите номер ударного слога.":"听。选出重读音节的序号。","Звук и буква":"音（音素）和字母","Послушайте и выберите точную форму среди похожих.":"听录音，并在相近的形式中选出准确的一项","Пропуск":"空缺，空白","Послушайте. Впишите только пропущенные буквы.":"听录音。只填写漏掉的字母。","Часть предложения":"句子片段","Послушайте короткий фрагмент и напишите его полностью.":"听一小段录音，把它完整写下来。","Предложение":"句子","Прочитайте и послушайте. Совпадает ли предложение с записью?":"朗读并听录音。句子和录音内容是否一致？","Итог слышу то что написано":"总结：听到的内容和所写内容一致","Послушайте 10 предложений. Если запись совпадает с текстом, отметьте «Совпадает». Если нет, выберите «Не совпадает» и исправьте предложение. Отправьте всю работу одной кнопкой.":"听 10 个句子。如果录音与文本一致，勾选 “一致”。如果不一致，选择 “不一致” 并改正句子。一键提交全部作答内容。","Слышу слово в словосочетании":"听到词组中的单词","Послушайте реплику. Выберите слово, которое прозвучало.":"听对话短句。选出听到的单词。","Звук и буквы":"音素与字母","Послушайте реплику. Выберите правильное написание пропущенного слова.":"听对话短句。选出空缺单词的正确拼写形式。","Пишу услышанное слово":"写下听到的单词","Послушайте отдельное слово. Напишите его.":"听单独的单词，并把它写下来。","Слышу смысловую группу":"听到语义组。","Послушайте реплику. Выберите смысловую группу, которая прозвучала.":"听对话短句。选出录音中出现的语义组。","Собираю реплику":"拼接 / 组合对话短句","Послушайте реплику. Расположите блоки в порядке записи.":"听对话短句。将各个片段按照录音里的顺序排列。","Понимаю функцию реплики":"理解对白（答话）的功能","Послушайте реплику. Выберите, что делает говорящий.":"听对话短句。选出说话人的交际行为。","Заполняю пропуск на слух":"凭听力填空","Послушайте реплику. Впишите пропущенное слово.":"听对话短句。填入空缺的单词。","Итог диалог с пропусками":"总结：带空白的对话（对话填空）","Прочитайте слова. Послушайте каждый диалог два раза. Вставьте пропущенные слова. Можно менять форму слова. После трёх диалогов нажмите «Завершить». Один балл за правильное слово; ошибки в написании не снижают балл.":"读单词。每段对话听两遍。填入空缺单词。可以改变单词形式。三段对话完成后点击 “结束”。填对一个单词得一分；拼写错误不扣分。","Что это? Назовите часть тела.":"这是什么？说出身体部位的名称。","Прочитайте. Какая это часть тела или способность?":"读一读。这是身体部位还是感官能力？","Как называется эта болезнь или проблема?":"这个疾病或者问题叫什么？","Прочитайте. Что означает это название?":"读一读。这个名称是什么意思？","Какой симптом или состояние показывает картинка?":"图片展示的是哪一种症状或者身体状态？","Прочитайте. Как вы понимаете эту жалобу?":"读一读。你如何理解这条身体不适的诉说？","Кто это? Что делает этот человек?":"这是谁？这个人在做什么？","Прочитайте. Кто это и что он делает?":"读一读。这是谁，他在做什么？","Что это за место или что помогает найти врача?":"这是什么地方，或者什么东西有助于找到医生？","Прочитайте. Как вы понимаете это слово или сочетание?":"读一读。你如何理解这个单词或者词组？","Что это? Назовите предмет или действие.":"这是什么？说出物品名称或者动作。","Прочитайте. Объясните значение слова или сочетания.":"读一读。解释单词或词组的含义。","Посмотрите: картинка помогает выбрать точное слово.":"请看：图片帮助选出准确的单词。","Сначала полностью звучит слово, затем выбирается написанный вариант.":"先完整播放单词读音，之后选出书写的选项。","Послушайте слово и выберите ударный слог.":"听单词，选出重读音节。","Послушайте всё сочетание и впишите только недостающую часть.":"听整个词组，只填写缺失的部分。","Прочитайте ситуацию, при желании прослушайте её и выберите слово.":"阅读情景描述，如果需要可以听一遍，然后选出单词。","Выберите одно точное простое объяснение.":"选择一个准确、简洁的释义。","Прослушайте слово или словосочетание. Само слово на экране не показывается. Выберите точное объяснение.":"听单词或词组。屏幕上不显示该词。选择准确的释义。","Выберите правильную форму слова в модели.":"参照范例，选出单词的正确词形。","Произнесите объяснение в отведённое время, затем выберите эталон.":"在规定时间内口述释义，之后选择标准参考答案。","Соедините 20 слов с 20 пронумерованными объяснениями.":"将 20 个单词和 20 条带编号的释义进行连线匹配。","Выберите слово, которое соответствует изображению.":"选出与图片相符的单词。","Прослушайте запись и выберите слово.":"听录音，选出单词。","Прослушайте форму и нажмите на ударный слог.":"听词形，点击重读音节。","Прослушайте запись и напишите ответ.":" /* Exact interface translations supplied by the teacher; never alter answer values. */
(() => {
  const dictionary=window.RKI_MANUAL_UI||{};
  let observer, scheduled=false;
  const chinese=/[\u3400-\u9fff]/u;
  function refresh(){
    scheduled=false;
    observer?.disconnect();
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    for(const node of nodes){
      const parent=node.parentElement;
      if(!parent||parent.closest('script,style,textarea,input,select,[data-manual-zh],[lang^="zh"],.scheme-zh'))continue;
      let original=node.nodeValue;
      if(!original.trim()||original.length>1600)continue;
      let ru=original.trim();
      const at=ru.search(chinese);
      if(at>=0)ru=ru.slice(0,at).replace(/[\s·:：]+$/u,'');
      let zh=dictionary[ru];
      if(!zh)continue;
      const next=node.nextSibling;
      if(next?.nodeType===1&&(next.matches('.zh,[data-manual-zh]')||
          (chinese.test(next.textContent)&&!/[А-Яа-яЁё]/u.test(next.textContent)))){
        if(next.textContent!==zh)next.textContent=zh;
        next.dataset.manualZh='1';
      }else{
        node.nodeValue=original.slice(0,original.indexOf(ru))+ru;
        const label=document.createElement('span');
        label.className='manual-zh';label.lang='zh-Hans';label.dataset.manualZh='1';label.textContent=zh;
        node.after(label);
      }
    }
    observer?.observe(document.body,{subtree:true,childList:true,characterData:true});
  }
  function start(){
    const style=document.createElement('style');
    style.textContent='.manual-zh{display:block;font-size:.88em;line-height:1.45;white-space:pre-line;font-weight:400;margin-top:.3em}.scheme-zh{line-height:1.5;white-space:pre-line;margin-top:.7em;font-weight:400;color:#334e61}.manual-feedback-zh{white-space:pre-line;line-height:1.5;margin-top:1em}';
    document.head.append(style);
    observer=new MutationObserver(()=>{if(!scheduled){scheduled=true;queueMicrotask(refresh);}});
    refresh();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
